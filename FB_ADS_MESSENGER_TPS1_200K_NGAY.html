&lt;header class=&quot;hero&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;TPS1 • Facebook Ads → Messenger&lt;/div&gt;&lt;h1&gt;Bộ bài thắng &amp; quy trình lấy SĐT&lt;/h1&gt;&lt;p&gt;Một campaign • một ad set • tối đa hai ads hoạt động • chỉ nhắm khách B2B mua định kỳ&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;orb&quot;&gt;&lt;b&gt;200K&lt;/b&gt;&lt;span&gt;mỗi ngày&lt;/span&gt;&lt;/div&gt;&lt;/header&gt;
&lt;section class=&quot;grid stats&quot;&gt;&lt;div class=&quot;card stat&quot;&gt;&lt;span&gt;Baseline hội thoại&lt;/span&gt;&lt;b&gt;46.122đ&lt;/b&gt;&lt;small class=&quot;muted&quot;&gt;10 cuộc / 461.216đ&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;card stat&quot;&gt;&lt;span&gt;Mục tiêu hội thoại&lt;/span&gt;&lt;b&gt;90–110&lt;/b&gt;&lt;small class=&quot;muted&quot;&gt;trong 30 ngày&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;card stat&quot;&gt;&lt;span&gt;Mục tiêu SĐT&lt;/span&gt;&lt;b&gt;30–44&lt;/b&gt;&lt;small class=&quot;muted&quot;&gt;≥40% tổng chat&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;card stat&quot;&gt;&lt;span&gt;Chi phí/SĐT&lt;/span&gt;&lt;b&gt;≤130K&lt;/b&gt;&lt;small class=&quot;muted&quot;&gt;cảnh báo &amp;gt;160K&lt;/small&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Ba bài được team chọn&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Điểm dự báo chuyên môn; bài thắng thật chọn bằng chi phí/SĐT và báo giá&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid rank-grid&quot;&gt;&lt;article class=&quot;card rank&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Hạng 1 • Chủ lực&lt;/span&gt;&lt;h3&gt;Quy trình danh sách&lt;/h3&gt;&lt;div class=&quot;score&quot;&gt;90,3/100&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:90.3%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;card rank&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Hạng 2 • Lọc geo&lt;/span&gt;&lt;h3&gt;Gọi đúng địa bàn&lt;/h3&gt;&lt;div class=&quot;score&quot;&gt;89,7/100&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:89.7%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;article class=&quot;card rank&quot;&gt;&lt;span class=&quot;viz-badge&quot;&gt;Hạng 3 • Nhu cầu nóng&lt;/span&gt;&lt;h3&gt;Nỗi lo vận hành&lt;/h3&gt;&lt;div class=&quot;score&quot;&gt;85,0/100&lt;/div&gt;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:85%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Nội dung quảng cáo hoàn chỉnh&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Chọn mẫu, kiểm tra shot list rồi sao chép sang Ads Manager&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;tabs&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; data-ad=&quot;A&quot;&gt;AD-A • Quy trình&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ad=&quot;B&quot;&gt;AD-B • Nỗi lo&lt;/button&gt;&lt;button class=&quot;btn&quot; data-ad=&quot;C&quot;&gt;AD-C • Khu vực&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ad-layout&quot;&gt;&lt;aside class=&quot;card creative-plan&quot;&gt;&lt;span id=&quot;adBadge&quot; class=&quot;viz-badge&quot;&gt;&lt;/span&gt;&lt;h3 id=&quot;adTitle&quot;&gt;&lt;/h3&gt;&lt;p&gt;&lt;b&gt;Định dạng:&lt;/b&gt; &lt;span id=&quot;adFormat&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;ol id=&quot;adShots&quot;&gt;&lt;/ol&gt;&lt;p class=&quot;muted&quot; id=&quot;adCaution&quot;&gt;&lt;/p&gt;&lt;/aside&gt;&lt;article class=&quot;card copy-panel&quot;&gt;&lt;div id=&quot;adCopy&quot; class=&quot;ad-copy&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;b&gt;Headline:&lt;/b&gt; &lt;span id=&quot;adHeadline&quot;&gt;&lt;/span&gt;&lt;/p&gt;&lt;div class=&quot;copy-actions&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;copyAd&quot;&gt;Sao chép toàn bộ bài&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;copyHeadline&quot;&gt;Sao chép headline&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Set Ads Manager theo từng cấp&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Giữ campaign cũ làm baseline, không sửa hoặc xóa&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid step-grid&quot;&gt;&lt;article class=&quot;card step&quot;&gt;&lt;b&gt;1 • Campaign&lt;/b&gt;&lt;p&gt;Objective: Engagement&lt;br&gt;Tên: TPS1 | Messenger | B2B | 200K | T7-2026&lt;br&gt;Không Special Ad Category&lt;br&gt;Không campaign budget&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;card step&quot;&gt;&lt;b&gt;2 • Ad Set&lt;/b&gt;&lt;p&gt;Messaging apps → chỉ Messenger&lt;br&gt;Maximize number of conversations&lt;br&gt;200.000đ/ngày&lt;br&gt;25–55 • mọi giới • broad theo geo&lt;br&gt;Advantage+ placements&lt;/p&gt;&lt;/article&gt;&lt;article class=&quot;card step&quot;&gt;&lt;b&gt;3 • Ads&lt;/b&gt;&lt;p&gt;Ngày 1 bật AD-A + AD-B&lt;br&gt;CTA: Gửi tin nhắn&lt;br&gt;Sau ≥72 giờ và ≥100K/mẫu: giữ mẫu có SĐT tốt hơn, đưa AD-C thay mẫu yếu&lt;/p&gt;&lt;/article&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Flow Messenger: hỏi từng câu&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Tạo giá trị trước, xin SĐT sau&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;flow&quot;&gt;&lt;div&gt;&lt;b&gt;① Chọn nhu cầu&lt;/b&gt;&lt;br&gt;Báo giá / Kiểm tra khu vực / Nguồn định kỳ&lt;/div&gt;&lt;div&gt;&lt;b&gt;② Lọc nhu cầu&lt;/b&gt;&lt;br&gt;Nhóm hàng → khu vực → loại hình&lt;/div&gt;&lt;div&gt;&lt;b&gt;③ Tóm tắt&lt;/b&gt;&lt;br&gt;Nhắc lại dữ liệu và việc TPS1 sẽ kiểm tra&lt;/div&gt;&lt;div&gt;&lt;b&gt;④ Xin SĐT&lt;/b&gt;&lt;br&gt;Tên + SĐT/Zalo để xác nhận quy cách và gửi báo giá&lt;/div&gt;&lt;div&gt;&lt;b&gt;⑤ Khai thác sâu&lt;/b&gt;&lt;br&gt;Sản lượng → tần suất → ngày bắt đầu&lt;/div&gt;&lt;div&gt;&lt;b&gt;⑥ Xin danh sách&lt;/b&gt;&lt;br&gt;Excel / PDF / ảnh / ba mặt hàng chính&lt;/div&gt;&lt;div&gt;&lt;b&gt;⑦ Xác nhận&lt;/b&gt;&lt;br&gt;Tóm tắt toàn bộ dữ liệu&lt;/div&gt;&lt;div&gt;&lt;b&gt;⑧ Gắn nhãn&lt;/b&gt;&lt;br&gt;SĐT / danh sách / báo giá / ngoài vùng&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Mẫu tin nhắn phản hồi&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Bấm Sao chép để lưu vào Meta Business Suite&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div id=&quot;templates&quot; class=&quot;grid template-grid&quot;&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Nhãn hội thoại&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Gắn ngay khi trạng thái thay đổi&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;label-cloud&quot;&gt;&lt;span&gt;Mới nhắn&lt;/span&gt;&lt;span&gt;Đã trả lời 2 câu&lt;/span&gt;&lt;span&gt;B2B trong vùng&lt;/span&gt;&lt;span&gt;Có số điện thoại&lt;/span&gt;&lt;span&gt;Có danh sách hàng&lt;/span&gt;&lt;span&gt;Cần báo giá&lt;/span&gt;&lt;span&gt;Mua lẻ&lt;/span&gt;&lt;span&gt;Ngoài vùng&lt;/span&gt;&lt;span&gt;Không phản hồi&lt;/span&gt;&lt;span&gt;Đã chốt&lt;/span&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Quy tắc tối ưu&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Không chọn bài thắng bằng lượt thích hoặc CTR đơn lẻ&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;table-wrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Tình huống&lt;/th&gt;&lt;th&gt;Quyết định&lt;/th&gt;&lt;th&gt;Ưu tiên đo&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Chưa đủ 72 giờ hoặc chưa chi 100K/mẫu&lt;/td&gt;&lt;td&gt;Không kết luận&lt;/td&gt;&lt;td&gt;Kiểm tra delivery và Messenger&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Có chat rẻ nhưng ít SĐT&lt;/td&gt;&lt;td&gt;Sửa flow/CTA&lt;/td&gt;&lt;td&gt;Tỷ lệ SĐT trên engaged&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;SĐT tốt, B2B đúng vùng&lt;/td&gt;&lt;td&gt;Giữ mẫu&lt;/td&gt;&lt;td&gt;Chi phí/SĐT và báo giá&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Mẫu yếu sau đủ dữ liệu&lt;/td&gt;&lt;td&gt;Tắt, đưa AD-C vào&lt;/td&gt;&lt;td&gt;SĐT, danh sách, báo giá&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Chi phí/SĐT &amp;gt;160K&lt;/td&gt;&lt;td&gt;Cảnh báo&lt;/td&gt;&lt;td&gt;Đọc nội dung chat trước khi đổi target&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Sale trả lời chậm&lt;/td&gt;&lt;td&gt;Không tăng ngân sách&lt;/td&gt;&lt;td&gt;≥90% phản hồi trong 15 phút&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;
&lt;section class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;div&gt;&lt;h2&gt;Checklist trước khi bấm Đăng&lt;/h2&gt;&lt;p class=&quot;muted&quot;&gt;Tích đủ 12 mục&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;grid check-grid&quot; id=&quot;checks&quot;&gt;&lt;/div&gt;&lt;/section&gt;
&lt;div class=&quot;guard&quot;&gt;&lt;b&gt;Không được dùng khi chưa xác minh&lt;/b&gt;&lt;p&gt;ISO, HACCP, “bình ổn giá”, “an toàn nhất”, “an tâm tuyệt đối”, “giao đúng–đủ–đều”, số năm, số khách hàng, tỷ lệ đúng hẹn, logo hoặc dữ liệu khách hàng.&lt;/p&gt;&lt;/div&gt;&lt;p class=&quot;footer&quot;&gt;TPS1 Messenger Lead Playbook • trực chat 07:00–21:00 • chỉ Facebook Ads → Messenger&lt;/p&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
